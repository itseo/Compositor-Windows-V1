name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\Compositor.Windows.sln

      - name: Build
        run: dotnet build .\Compositor.Windows.sln -c Release --no-restore

      - name: Publish Windows x64
        run: dotnet publish .\src\Compositor.Windows\Compositor.Windows.csproj -c Release -r win-x64 --self-contained true -o .\artifacts\Compositor-Windows-V0.1

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Compositor-Windows-V0.1-win-x64
          path: .\artifacts\Compositor-Windows-V0.1
          if-no-files-found: error
